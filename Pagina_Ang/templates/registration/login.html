{% extends "Pokemon/base.html" %}

{% block content %}
{% load static %}
{% load crispy_forms_tags %}

<div class="auth-page">
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
            <div class="text-center mb-4" style="padding-top: 20px;">
                <img src="{% static 'images/logo.png' %}" alt="logo" class="img-fluid mb-3" 
                style="width: 350px; height: auto; display: block; margin: 0 auto;">
                <h2 class="card-title text-center">Iniciar sesión</h2>
            </div>

            {% if form.non_field_errors %}
                <div class="alert alert-danger" role="alert">
                    {% for error in form.non_field_errors %}
                        {{ error }}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex justify-content-end mt-4">
                    <input class="btn btn-secondary me-2 rounded-pill" type="reset" value="Cancelar">
                    <input class="btn btn-primary rounded-pill" type="submit" value="Ingresar">
                </div>
            </form>

            <form method="get" action="{% url 'registro' %}" class="mt-3">
                <button type="submit" class="btn btn-primary w-100 rounded-pill" style="font-size: 1rem; font-weight: 600;">
                    Crear cuenta
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
