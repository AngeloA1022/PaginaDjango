{% extends "Pokemon/base.html" %}

{% block content %}
{% load static %}
{% load crispy_forms_tags %}

<div class="auth-page">
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 420px;">
            <div class="text-center mb-4" style="padding-top: 20px;">
                <img src="{% static 'images/logo.png' %}" alt="logo" class="img-fluid mb-3" style="max-width: 160px; height: auto; display: block; margin: 0 auto;">
                <h2 class="mb-0">Iniciar sesión</h2>
            </div>

            {% if form.non_field_errors %}
                <div class="alert alert-danger" role="alert">
                    {% for error in form.non_field_errors %}
                        {{ error }}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'registro' %}" class="text-decoration-none">Crear cuenta</a>
                    <div>
                        <input class="btn btn-secondary me-2" type="reset" value="Cancelar">
                        <input class="btn btn-primary" type="submit" value="Ingresar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
