<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de datos no disponible</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b1020, #1d2a3a);
            color: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            width: min(90%, 560px);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            text-align: center;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
        }
        p {
            margin: 8px 0;
            line-height: 1.6;
            color: #dfe7f3;
        }
        .btn {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 22px;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>Servicio temporalmente no disponible</h1>
        <p>No se pudo conectar con la base de datos.</p>
        <p>Intenta nuevamente en unos minutos.</p>
        <a class="btn" href="/">Volver al inicio</a>
    </div>
</body>
</html>
