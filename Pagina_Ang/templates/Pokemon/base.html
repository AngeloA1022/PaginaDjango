<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Django</title>
    <link rel="icon" href="{% static 'images/icono.png' %}" type="image/png">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav>
        <ul>
            <li><a href="{% url 'inicio' %}" aria-current="page">Bienvenida</a></li>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Consejos</a></li>
            <li><a href="#">Mapas</a></li>
            <li><a href="#">Objetos</a></li>
            <li><a href="#">Contacto</a></li>
            <li class="dropdown">
                <a class="dropdown-toggle" href="#" role="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    Pokemones
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="{% url 'crearPokemon' %}">Agregar Pokémon</a></li>
                    <li><a class="dropdown-item" href="#">Modificar Pokémon</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <div class="container-fluid">
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer></footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
