{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon en Django</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>body{padding-top:20px}</style>
</head>
<body>
    <div class="container">
        <div class="row mb-3">
            <div class="col">
                <h1>Catálogo de Pokemones</h1>
                <a href="{% url 'inicio' %}">Volver al Inicio</a>
            </div>
        </div>

        <div class="row">
            {% for p in pokemon %}
            <div class="col-12 col-sm-6 col-md-4 mb-3">
                <div class="card h-100">
                    <img src="{% static 'images/' %}{{ p.Imagen }}" class="card-img-top" alt="{{ p.Nombre }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ p.Nombre }}</h5>
                        <p class="card-text">Tipo: {{ p.Tipo }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
