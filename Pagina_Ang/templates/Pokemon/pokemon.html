{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon en Django</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <main class="pokemon-page">
        <section class="pokemon-section">
            <div class="pokemon-heading">
                <h1>Catálogo de Pokemones</h1>
                <a href="{% url 'inicio' %}">Volver al Inicio</a>
            </div>

            <div class="pokemon-grid">
                {% for p in pokemon %}
                <article class="pokemon-item">
                    <img src="{% static 'images/' %}{{ p.Imagen }}" alt="{{ p.Nombre }}">
                    <h3>{{ p.Nombre }}</h3>
                    <p>Tipo: {{ p.Tipo }}</p>
                </article>
                {% endfor %}
            </div>
        </section>
    </main>

    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
