{% extends 'Pokemon/base.html' %}

{% load static %}
{% block content %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/icono.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

<div class="container mt-5 pokemon-delete-confirmation">
    <h2 class="text-white" style="color: #ffffff !important;">Confirmar Eliminación de Pokémon</h2>
    <div class="pokemon-delete-message text-white" style="color: #ffffff !important;">
        ¿Estás seguro de que deseas eliminar el Pokémon 
        {{ pokemon.Nombre }} {{ pokemon.Tipo }}?
    </div>

    <form method="post">
        {% csrf_token %}
        <div class ="row">
            <div class="col">
                <a class="btn btn-dark" href="{% url 'pokemones' %}">Cancelar</a>
            </div>
            <div class="col">
                <button class="btn btn-danger" type="submit">Confirmar Eliminación</button>
            </div>
        </div>
    </form>
</div>

{% endblock %}
